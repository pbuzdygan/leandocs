# Publishes the Docker image to GHCR when the owner publishes a GitHub release (D-51).
#
#   release tag X.Y.Z     (commit on main) → ghcr.io/pbuzdygan/leandocs:X.Y.Z    + :latest
#   release tag devX.Y.Z  (commit on dev)  → ghcr.io/pbuzdygan/leandocs:devX.Y.Z + :dev_latest
#
# X.Y.Z must equal the root package.json version. Pushes and pull requests never publish images.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pbuzdygan/leandocs

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (moderate and above fail)
        run: pnpm audit --audit-level=moderate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  publish:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # All branches, so the release commit can be checked against main/dev.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Check the release tag, branch and version
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-tags.mjs "$TAG" "$IMAGE"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists. Publish a new version instead."
            exit 1
          fi

      - name: Build the image for this runner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: LEANDOCS_VERSION=${{ steps.release.outputs.version }}
          tags: leandocs:release
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image and check its version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker run -d --name leandocs-release -p 8080:8080 leandocs:release
          for attempt in $(seq 1 30); do
            if health="$(curl -fsS http://127.0.0.1:8080/api/v1/health)"; then
              docker stop leandocs-release
              echo "$health"
              reported="$(node -p 'JSON.parse(process.argv[1]).version' "$health")"
              if [ "$reported" != "$VERSION" ]; then
                echo "::error::The image reports version $reported instead of $VERSION."
                exit 1
              fi
              exit 0
            fi
            sleep 2
          done
          docker logs leandocs-release
          exit 1

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: LEANDOCS_VERSION=${{ steps.release.outputs.version }}
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=LeanDocs
            org.opencontainers.image.description=Documentation without the bloat.
            org.opencontainers.image.source=https://github.com/pbuzdygan/leandocs
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
