name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The workflow never pushes; do not leave the token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (moderate and above fail)
        run: pnpm audit --audit-level=moderate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    # Browsers and their system libraries are preinstalled in the official image, so no apt
    # install runs here (it could hang for an hour on slow mirrors). Keep the tag equal to the
    # @playwright/test version; a mismatch fails with "Executable doesn't exist".
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      # Report every engine, not just the first one that fails (P15-09).
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The workflow never pushes; do not leave the token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The Playwright binary directly: with HOME changed, pnpm (corepack) would look for itself
      # in another cache folder.
      - run: node_modules/.bin/playwright test
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          # Firefox refuses to start as root unless HOME belongs to root. Actions sets HOME to
          # /github/home for every container step, so it is overridden here, on the step.
          HOME: /root
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The workflow never pushes; do not leave the token in .git/config.
          persist-credentials: false
      - name: Build image (no push)
        run: docker build -f docker/Dockerfile -t leandocs:ci .
      - name: Start the image and wait until it is healthy
        run: |
          docker run -d --name leandocs-ci -p 8080:8080 leandocs:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then
              docker stop leandocs-ci
              exit 0
            fi
            sleep 2
          done
          docker logs leandocs-ci
          exit 1
